  summary: Beta 0.0.183 正式发布修复真实 canary、执行事实和照明纠错链：现场 0.0.182 的 Supervisor options
    已恢复为主卧 zhu_wo、light/switch 与两个明确实体的精确执行范围，天然 60 秒无人周期已验证灯带真实 turn_off；新增发布前运行版本、listener
