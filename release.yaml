  summary: Beta 0.0.219 将主动 AI 产品开关收口到 SmartAgent V4 设置页：业主可选关闭、观察学习或主动执行。主动执行默认覆盖全屋所有已纳管且能力合同完整的设备，不再要求业主维护
    canary 房间、domain 和实体清单；能力、风险、幂等、preflight、一次性执行证明、Receipt 与物理读回仍强制生效。全新安装仍以 shadow
    起步，canary 仅作为不可见的工程迁移兼容。0.0.219 同时补齐正式镜像对 Supervisor/Host Proof 启动合同的冒烟验证。公开发布不等于部署或现场验收，家庭设备仍需部署后按空间自然进出验证。
