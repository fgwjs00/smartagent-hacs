release_notes:
  summary: Beta 0.0.186 统一 V3 面向业主的中文展示和执行事实：空间、状态、来源、服务、日志与场景名称通过稳定投影显示中文，未知内部值失败关闭；事务页严格区分候选动作与真实
    action_results，不再把计划动作包装成已执行；待确认决策记录主体打开独立确认窗口并保留明确提交回执，右侧追溯按钮只打开只读证据链。固定照明场景以空间注册表生成中文名称但保持
    canonical space_id，图文手册同步为 42 页面、164 功能、302 截图；打包态和现场验收门禁统一使用“智能审计”。0.0.185 因打包态验收仍断言旧导航文案而被主线
    CI 拦截且未部署，0.0.186 修复门禁后重新进入五发布面、ACR 与真实 HA 部署。发行默认仍为 shadow、真实执行开关默认 false；部署必须保留现场
    zhu_wo + light/switch + 精确两实体 canary，Orvibo HomeBridge 继续停用。
  customer_visible_version: Beta 0.0.186
