    10 分钟内反向修改 AI 已成功执行的照明 light/switch 时写入带事务来源的隐式纠错，并支持 partial 多动作事务逐实体、连续纠错。源码、Linux
    amd64 预构建、前端产物和自动回归已通过，业主已授权进入五发布面与 ACR 正式发布。发行默认仍为 shadow、真实执行开关默认 false，Orvibo
    保持停用；真实 0.0.183 部署与后续现场学习验收仍为独立门禁。
