  summary: Beta 0.0.220 更新 SmartAgent V4 管理端：将首页、空间、设备、视觉感知和运维页按家庭任务重组，收口客户可读文案与状态表达，增加管理员待处理工作台和设备长列表分页。简明视图与工程视图继续使用同一路由、数据源、筛选与事务回执；候选、请求受理、执行与物理复核仍分层呈现。能力、风险、幂等、preflight、Host
    Proof、Receipt 与物理读回合同不变。公开发布不等于现场验收，部署后仍需按全屋空间自然进出验证人来灯亮、人走灯灭和目标灯选择。
